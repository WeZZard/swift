# Configuration for chained fixup tests

# These tests verify that swift-reflection-dump correctly handles
# DYLD chained fixups introduced in iOS 15 / macOS 12

# The tests are host-agnostic - they can run on Linux, macOS, or Windows
# since swift-reflection-dump is a host tool that analyzes target binaries

# Inherit suffixes from parent - no need to override
# The parent config already includes '.test' files